spring:
  application:
    name: salary-management
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/salary_management}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    baseline-on-migrate: true
    placeholders:
      db_username: ${SPRING_DATASOURCE_USERNAME:postgres}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  jwt:
    # Set APP_JWT_SECRET env var in production. Default is a stable dev-only secret.
    secret: ${APP_JWT_SECRET:dev-secret-key-for-testing-only-not-for-production-use}
    expiration-ms: 86400000
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.2:3b}
  session:
    ttl-seconds: 3600
    cleanup-interval-ms: 600000
