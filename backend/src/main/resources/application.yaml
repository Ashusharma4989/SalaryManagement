spring:
  application:
    name: salary-management
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/salary_management}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    baseline-on-migrate: true
    placeholders:
      db_username: ${SPRING_DATASOURCE_USERNAME:postgres}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  jwt:
    # Set APP_JWT_SECRET env var in production. Empty = random per-startup (dev only).
    secret: ${APP_JWT_SECRET:}
    expiration-ms: 86400000
