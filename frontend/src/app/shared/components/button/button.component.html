<button
  [type]="type"
  [class]="classes"
  [attr.aria-label]="ariaLabel"
  [disabled]="disabled || loading"
  (click)="onClick($event)"
>
  @if (loading) {
    <span class="spinner" aria-hidden="true"></span>
  }
  @if (icon) {
    <span class="icon">{{ icon }}</span>
  }
  <ng-content></ng-content>
</button>
