<app-page-header title="Pay Periods" subtitle="Define and manage pay periods." />

<app-card [title]="editingId() ? 'Edit Pay Period' : 'Add New Pay Period'">
  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="form-grid"
  >
    <app-form-field
      [form]="form"
      controlName="startDate"
      label="Start Date"
      type="date"
    />
    <app-form-field
      [form]="form"
      controlName="endDate"
      label="End Date"
      type="date"
    />
    <app-form-field
      [form]="form"
      controlName="status"
      label="Status"
      type="text"
      placeholder="OPEN"
    />

    <div class="form-actions">
      <button
        app-button
        variant="primary"
        type="submit"
        [loading]="saving()"
        [disabled]="form.invalid || saving()"
      >
        {{ editingId() ? 'Update' : 'Create' }}
      </button>
      <button
        app-button
        variant="ghost"
        type="button"
        (clicked)="add()"
      >
        New
      </button>
    </div>
  </form>
</app-card>

<app-card>
  <app-data-table
    [columns]="columns"
    [rows]="periods()"
    [loading]="loading()"
    [total]="total()"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()"
    [actions]="actions"
    [rowKey]="'id'"
    (pageChange)="onPageChange($event)"
  />
</app-card>
