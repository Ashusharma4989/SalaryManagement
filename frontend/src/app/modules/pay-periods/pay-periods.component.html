<app-page-template
  pageTitle="Pay Periods"
  cardTitle="Add New Pay Period"
  [pageForm]="form"
  [saving]="saving()"
  [submitLabel]="editingId() ? 'Update' : 'Create'"
  [columns]="columns"
  [rows]="periods()"
  [total]="total()"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  [actions]="actions"
  rowKey="id"
  (formSubmit)="submit()"
  (pageChange)="onPageChange($event)"
>
  <app-form-field
    page-template-form
    [form]="form"
    controlName="startDate"
    label="Start Date"
    type="date"
  />
  <app-form-field
    page-template-form
    [form]="form"
    controlName="endDate"
    label="End Date"
    type="date"
  />
  <app-form-field
    page-template-form
    [form]="form"
    controlName="status"
    label="Status"
    type="text"
    placeholder="OPEN"
  />
</app-page-template>
