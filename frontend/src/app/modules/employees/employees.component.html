<app-page-template
  pageTitle="Employees"
  cardTitle="Add New Employee"
  [pageForm]="form"
  [saving]="saving()"
  [submitLabel]="editingId() ? 'Update' : 'Create'"
  [columns]="columns"
  [rows]="employees()"
  [total]="total()"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  [actions]="actions"
  rowKey="id"
  (formSubmit)="submit()"
  (pageChange)="onPageChange($event)"
>
  <app-form-field
    page-template-form
    [form]="form"
    controlName="employeeNumber"
    label="Employee Number"
    type="text"
    placeholder="e.g. EMP-001"
  />
  <app-form-field
    page-template-form
    [form]="form"
    controlName="firstName"
    label="First Name"
    type="text"
    placeholder="e.g. John"
  />
  <app-form-field
    page-template-form
    [form]="form"
    controlName="lastName"
    label="Last Name"
    type="text"
    placeholder="e.g. Doe"
  />
  <app-form-field
    page-template-form
    [form]="form"
    controlName="email"
    label="Email"
    type="email"
    placeholder="e.g. john.doe@example.com"
  />
  <app-form-field
    page-template-form
    [form]="form"
    controlName="departmentId"
    label="Department"
    type="select"
    placeholder="-- None --"
    [options]="departmentOptions"
  />
  <app-form-field
    page-template-form
    [form]="form"
    controlName="location"
    label="Location"
    type="text"
    placeholder="e.g. New York"
  />
  <app-form-field
    page-template-form
    [form]="form"
    controlName="currencyCode"
    label="Currency"
    type="text"
    placeholder="USD"
  />
  <app-form-field
    page-template-form
    [form]="form"
    controlName="hireDate"
    label="Hire Date"
    type="date"
  />
</app-page-template>
