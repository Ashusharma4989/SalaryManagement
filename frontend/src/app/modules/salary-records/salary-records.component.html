<app-page-template
  pageTitle="Salary Records"
  pageDescription="Create and manage salary records with earning/deduction items."
  cardTitle="Add New Salary Record"
  [pageForm]="form"
  [saving]="saving()"
  [submitLabel]="editingId() ? 'Update' : 'Create'"
  [columns]="columns"
  [rows]="records()"
  [loading]="loading()"
  [total]="total()"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  [actions]="actions"
  rowKey="id"
  (formSubmit)="submit()"
  (pageChange)="onPageChange($event)"
>
  <app-form-field
    page-template-form
    [form]="form"
    controlName="employeeId"
    label="Employee"
    type="select"
    placeholder="-- Select --"
    [options]="employeeOptions"
  />
  <app-form-field
    page-template-form
    [form]="form"
    controlName="payPeriodId"
    label="Pay Period"
    type="select"
    placeholder="-- Select --"
    [options]="payPeriodOptions"
  />
  <app-form-field
    page-template-form
    [form]="form"
    controlName="baseSalary"
    label="Base Salary"
    type="number"
    placeholder="0.00"
  />
  <app-form-field
    page-template-form
    [form]="form"
    controlName="currencyCode"
    label="Currency"
    type="text"
    placeholder="USD"
  />

  <app-salary-items-field
    page-template-form
    [form]="form"
    controlName="salaryItems"
  />
</app-page-template>
