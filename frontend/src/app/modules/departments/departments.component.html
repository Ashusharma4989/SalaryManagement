<app-page-template
  pageTitle="Departments"
  [pageForm]="form"
  [saving]="saving()"
  [submitLabel]="editingId() ? 'Update' : 'Create'"
  cardTitle="Add New Department"
  [columns]="columns"
  [rows]="departments()"
  [total]="total()"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  [actions]="actions"
  rowKey="id"
  [searchable]="true"
  [searchTerm]="searchTerm()"
  [sortField]="sortField()"
  [sortDirection]="sortDirection()"
  (formSubmit)="submit()"
  (pageChange)="onPageChange($event)"
  (sort)="onSort($event.field, $event.direction)"
  (search)="onSearch($event)"
>
  <app-form-field
    page-template-form
    [form]="form"
    controlName="name"
    label="Name"
    type="text"
    placeholder="e.g. Engineering"
  />
</app-page-template>
