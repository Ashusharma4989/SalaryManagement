<app-page-template
  pageTitle="Users"
  cardTitle="Create New User"
  [pageForm]="form"
  [saving]="creating()"
  submitLabel="Create User"
  [columns]="columns"
  [rows]="users()"
  [total]="total()"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  [actions]="actions"
  rowKey="id"
  (formSubmit)="submit()"
  (pageChange)="onPageChange($event)"
>
  <app-form-field
    page-template-form
    [form]="form"
    controlName="username"
    label="Username"
    type="text"
    placeholder="e.g. hr_new"
  />
  <app-form-field
    page-template-form
    [form]="form"
    controlName="password"
    label="Password"
    type="password"
    placeholder="Min 8 characters"
  />
  <app-form-field
    page-template-form
    [form]="form"
    controlName="role"
    label="Role"
    type="select"
    [options]="roleOptions"
  />
  <app-form-field
    page-template-form
    [form]="form"
    controlName="employeeId"
    label="Employee"
    type="select"
    placeholder="-- None --"
    [options]="employeeOptions"
  />
</app-page-template>
